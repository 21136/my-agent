<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Twin</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }
      /* Keep full splash frame visible: letterbox/pillarbox when window aspect differs (e.g. 1280x720 video in 960x720). Never crop. */
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        background: #05060a;
      }
    </style>
  </head>
  <body>
    <video id="splash-video" autoplay muted playsinline>
      <source src="./splash-xiaomowang.mp4" type="video/mp4" />
    </video>
  </body>
</html>
