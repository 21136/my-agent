<!DOCTYPE html>
<html lang="zh-CN" data-style="music">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>05 · Music Dreamer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_shared.css" />
  <link rel="stylesheet" href="_working.css" />
  <style>
    :root {
      --bg: #0d0d12;
      --surface: #16161f;
      --sidebar: #16161f;
      --flow-a: #2d1f4e;
      --flow-b: #5b21b6;
      --flow-c: #a78bfa;
      --flow-duration: 4.5s;
      --surface-2: #1e1e2a;
      --text: #f0eef8;
      --muted: #9490a8;
      --border: rgba(167, 139, 250, 0.2);
      --accent: #a78bfa;
      --accent-2: #f472b6;
      --accent-soft: rgba(167, 139, 250, 0.12);
      --danger: #fb7185;
      --radius: 12px;
      --shadow: 0 12px 40px rgba(0,0,0,0.5);
      --font: "Inter", "Noto Sans SC", system-ui, sans-serif;
      --sidebar-w: 280px;
    }
    body {
      background: radial-gradient(ellipse 80% 60% at 20% 0%, rgba(124, 58, 237, 0.25), transparent),
                  radial-gradient(ellipse 60% 50% at 90% 80%, rgba(244, 114, 182, 0.15), transparent),
                  var(--bg);
    }
    .topbar { border-bottom: 1px solid var(--border); background: rgba(22, 22, 31, 0.85); backdrop-filter: blur(12px); }
    .sidebar {
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(30, 27, 46, 0.95), rgba(13, 13, 18, 0.98));
    }
    .project-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.25rem 0.55rem; border-radius: 999px;
      background: linear-gradient(135deg, rgba(167,139,250,0.2), rgba(244,114,182,0.15));
      border: 1px solid var(--border); font-size: 0.72rem; color: var(--accent);
    }
    .task-card {
      border: 1px solid var(--border);
      background: linear-gradient(145deg, rgba(30,27,46,0.8), rgba(22,22,31,0.9));
      border-radius: var(--radius);
    }
    .task-card h3 { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .process-card { border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius); }
    .composer { border-top: 1px solid var(--border); background: rgba(22, 22, 31, 0.9); }
    .context-bar { background: transparent; border-bottom: 1px solid var(--border); }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #db2777); border: none; color: #fff; }
    .chip.on { background: var(--accent-soft); color: var(--accent); }
    .album-art {
      width: 100%; height: 72px; border-radius: 10px; margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #4c1d95, #831843, #1e1b4b);
      display: flex; align-items: flex-end; padding: 0.5rem;
      font-size: 0.7rem; color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div class="app-frame music-layout" id="app-frame"></div>
  <script src="_shared.js"></script>
</body>
</html>
