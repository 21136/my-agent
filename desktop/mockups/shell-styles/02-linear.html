<!DOCTYPE html>
<html lang="zh-CN" data-style="linear">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 · Linear 清爽</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_shared.css" />
  <link rel="stylesheet" href="_working.css" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --sidebar: #ffffff;
      --flow-a: #eef2ff;
      --flow-b: #bfdbfe;
      --flow-c: #2563eb;
      --flow-duration: 4.5s;
      --surface-2: #f4f4f5;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #5b5bd6;
      --accent-soft: rgba(91, 91, 214, 0.08);
      --danger: #dc2626;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,0.04);
      --font: "Inter", "Noto Sans SC", system-ui, sans-serif;
      --sidebar-w: 260px;
    }
    body { font-size: 14px; }
    .topbar { border-bottom: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
    .sidebar { border-right: 1px solid var(--border); background: var(--surface); }
    .brand { font-weight: 700; letter-spacing: -0.03em; }
    .task-card { border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; box-shadow: var(--shadow); }
    .msg { border: none; padding: 0.65rem 0; }
    .msg + .msg { border-top: 1px solid var(--border); }
    .process-card { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }
    .composer { border-top: 1px solid var(--border); background: var(--surface); }
    .context-bar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .btn-primary { background: var(--accent); border: none; color: #fff; font-weight: 600; }
    .status-dot { background: var(--accent); }
    .chip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  </style>
</head>
<body>
  <div class="app-frame" id="app-frame"></div>
  <script src="_shared.js"></script>
</body>
</html>
