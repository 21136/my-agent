<!DOCTYPE html>
<html lang="zh-CN" data-style="dark-pro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 · 暗色专业</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_shared.css" />
  <link rel="stylesheet" href="_working.css" />
  <style>
    :root {
      --bg: #1c1c1e;
      --surface: #2c2c2e;
      --sidebar: #252527;
      --flow-a: #1e3a5f;
      --flow-b: #1d4ed8;
      --flow-c: #0a84ff;
      --flow-duration: 4.5s;
      --surface-2: #3a3a3c;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #48484a;
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.15);
      --danger: #ff453a;
      --radius: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --font: "Inter", "Noto Sans SC", system-ui, sans-serif;
      --sidebar-w: 256px;
    }
    body { font-size: 14px; }
    .topbar { border-bottom: 1px solid var(--border); background: var(--surface); }
    .sidebar { border-right: 1px solid var(--border); background: #252527; }
    .task-card { border: 1px solid var(--border); background: var(--bg); border-radius: 10px; }
    .process-card { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; }
    .composer { border-top: 1px solid var(--border); background: var(--surface); }
    .context-bar { background: #252527; border-bottom: 1px solid var(--border); }
    .btn-primary { background: var(--accent); border: none; color: #fff; }
    .chip { background: var(--bg); color: var(--muted); border-color: var(--border); }
    .chip.on { background: var(--accent-soft); color: #64b5ff; border-color: transparent; }
    .msg code { background: #1a1a1c; }
    .view-process { background: rgba(255, 69, 58, 0.15); color: #ff6961; border: 1px solid rgba(255, 69, 58, 0.3); }
  </style>
</head>
<body>
  <div class="app-frame" id="app-frame"></div>
  <script src="_shared.js"></script>
</body>
</html>
