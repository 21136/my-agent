<main class="page">
<header class="page-head"><div><h1>让气泡开口，让正文展开。</h1><p class="intro">短消息保留漫画对白；长回复不再是一整块装饰面板。小魔王、名字和发言位置不变。</p></div><span class="preview-note">仅气泡区域 · 静态设计稿</span></header>

<section class="frame"><header class="frame-head"><div><h2 id="view-title">短消息有造型，长消息有版式</h2><p id="view-description">沿用原对话，不新增标题、不删正文；长回复保留原有首段作为开场。</p></div><span class="frame-hint">同内容 · 同字号 · 同宽度</span></header><div class="chat layout-view adaptive" data-view="adaptive"></div><div class="chat layout-view boxed" data-view="boxed" hidden></div></section>

<template id="prose">
<div class="turn user-turn"><div class="bubble user">不用分点，也不用替我总结。就用几段连贯的文字讲清楚，我想看看长内容读起来是什么感觉。</div></div>
<div class="turn pet-turn"><img class="avatar" src="../public/pet-assets/avatar/pet-idle-still.webp" width="44" height="44" alt="小魔王头像"><div class="pet-content"><div class="speaker"><span>小魔王</span><span class="status">搞定</span></div><div class="bubble assistant">
<p>长回复最容易出现的问题，并不是字数本身，而是所有文字被同一个视觉容器锁在一起。短短两句话放进气泡时，轮廓、尾角和阴影会让人感到这是一个角色正在说话；当内容不断增长，这些装饰却不会产生新的阅读线索，只会沿着整块文字继续向下延伸。读者看到的是一张越来越大的卡片，而不是一段有起伏的交流。即使换了颜色，或者把圆角做得更精致，这个问题也仍然存在，因为真正需要改变的是长内容的承载方式，而不是给原来的外壳继续添加效果。</p>
<p>因此，这一版不要求长内容必须带有标题，也不会为了做出层次而改写原句。假如回复本来就是连续的几段话，它仍然保持几段话的样子。界面负责控制行宽、行距和段落之间的距离，让眼睛能够轻松找到下一行，也能看出一个意思在哪里结束、另一个意思从哪里开始。这里的留白不是用来填满页面，而是给阅读提供明确的停顿。</p>
<p>小魔王依然留在原来的位置。头像和名字告诉你这是谁的回答，开头保留的少量造型告诉你这段交流从这里开始，但这些标记不需要一路包围所有内容。与其让角色装饰铺满每一行，不如把角色感集中在说话的入口，再让正文安静地展开。这样既不会把它变成一篇与聊天无关的文章，也不会让一大段内容显得像一块厚重的面板。</p>
<p>这里还有一个容易被忽略的细节：第一段并不总适合放进开场气泡。有时第一段本身就很长，如果仍然强行把它塞进去，只是把原先的大框问题缩小了一点，并没有真正解决。因此，这个预览不会自动生成摘要，也不会把第一段截断。首段过长时，内容从阅读区直接开始，用一个很短的边缘标记保留发言的起点。</p>
<p>用户发来的长内容也需要同样的处理。短句可以是一枚轻巧的右侧气泡，长段文字则不必被大面积的填色覆盖。它仍然靠右、保持原有顺序，只把方向感留在局部细节上。这样在上下滚动时，整段对话不会被两个巨大的彩色矩形交替占据，角色的差异也不必完全依赖两种背景色。</p>
<p>这不意味着所有回复都要变成相同的排版。短消息仍然适合保留鲜明的轮廓，引用仍然应该和正文有所区别，代码需要自己的等宽字体与横向滚动，表格也需要对齐的列。但这些都是根据内容本身已有的结构来安排，而不是为了让页面看起来丰富，给每个段落都再套上一张卡片。</p>
<p>最后，判断这套设计是否合适，不应该只看开头两句话。需要把整段内容向下读完，看中间的段落是否仍然舒服，看结尾是否自然结束，也要在窄一些的窗口里检查换行。真正耐看的长回复，不是让所有地方都成为视觉重点，而是让人在读了很多行之后，仍然愿意继续读下去。</p>
</div></div></div>
</template>
<template id="technical">
<div class="turn user-turn"><div class="bubble user">如果回复里有列表、代码和表格，也按同一套样式排一下。</div></div>
<div class="turn pet-turn"><img class="avatar" src="../public/pet-assets/avatar/pet-idle-still.webp" width="44" height="44" alt="小魔王头像"><div class="pet-content"><div class="speaker"><span>小魔王</span><span class="status">搞定</span></div><div class="bubble assistant">
<p>可以。下面只是一份排版样例：正文、引用、代码和表格各自保留结构，不用一个大气泡把它们全部包起来。</p>
<h3>先让正文保持连续</h3><p>普通段落继续沿同一条阅读线展开。标题提供层级，列表表达并列关系；不需要把每种内容再做成一张独立的卡片，也不改变它们原本出现的顺序。</p>
<ul><li>小魔王的头像、名字和状态仍在发言开头。</li><li>正文不生成额外摘要，已有的强调与引用会被保留。</li><li>代码与宽表格在自己的区域内横向滚动，不撑破聊天区域。</li></ul>
<blockquote>引用的重点是“这是另一段被引用的内容”，而不是在长回复内部再出现一个完整的装饰面板。</blockquote>
<h3>代码保留自己的节奏</h3><p>下面的数据全部是静态示例，用来检验等宽字体、缩进和长行。</p>
<pre tabindex="0" role="region" aria-label="代码示例，可横向滚动"><code>{
  "example": "layout-only",
  "message": {
    "speaker": "小魔王",
    "content": "保留原始内容与段落结构",
    "longLine": "这是一条刻意保留的长行，用于检查代码块能否独立横向滚动，而不是挤压正文或让整个预览页面出现横向滚动。"
  }
}</code></pre>
<h3>表格靠对齐，而不是靠大边框</h3><div class="table-wrap" tabindex="0" role="region" aria-label="表格示例，可横向滚动"><table><thead><tr><th>内容形态</th><th>展示方式</th><th>不做什么</th></tr></thead><tbody><tr><td>短消息</td><td>保留漫画式对白轮廓</td><td>不为一句话扩出整行卡片</td></tr><tr><td>长段落</td><td>开放式连续阅读区</td><td>不缩字，不截断，不默认折叠</td></tr><tr><td>引用与代码</td><td>保留原有内容结构</td><td>不新增模型没有写出的标题</td></tr><tr><td>宽表格</td><td>区域内横向滚动</td><td>不让整条消息撑破窗口</td></tr></tbody></table></div>
<p>读到这里，发言仍然是一条完整的回复。没有把一个段落拆成一串小气泡，也没有用折叠按钮把长内容藏起来；改变的只是它在屏幕上的阅读方式。</p>
</div></div></div>

<script>
const state={sample:'original',layout:'adaptive'};
const layoutNotes={adaptive:['短消息有造型，长消息有版式','不新增摘要或标题，不删减文字；有合适的原有首段时，保留为开场。'],boxed:['对照：把整段回复放进一个气泡','正文、字号和阅读宽度相同，仅恢复整块气泡的外壳。']};
const sampleNotes={original:'正在展示截图中的原对话。可切换「整块气泡对照」观察同一内容；压力样例仅用于排版，不是新增模型输出。',prose:'纯长文压力样例：无标题、无列表，首段也很长。内容为本地排版示例，不是新增模型输出。',technical:'混合内容压力样例：标题、列表、引用、代码与宽表格。所有数据均为静态排版示例。'};
function classify(message){return message.textContent.trim().length>260||!!message.querySelector('pre,table')||message.querySelectorAll(':scope > p').length>=5;}
function render(){
 for(const view of document.querySelectorAll('[data-view]')){
  view.replaceChildren(document.getElementById(state.sample).content.cloneNode(true));
  if(view.dataset.view==='adaptive'){
   for(const user of view.querySelectorAll('.user')) if(classify(user))user.classList.add('long-user');
   for(const reply of view.querySelectorAll('.assistant')){
    if(!classify(reply))continue;
    reply.classList.remove('bubble');reply.classList.add('reading-turn');
    const body=document.createElement('div');body.className='reading-body';
    const first=reply.firstElementChild;
    if(first?.tagName==='P'&&first.textContent.trim().length<=160){const leading=document.createDocumentFragment();while(reply.firstChild&&reply.firstChild!==first)leading.append(reply.firstChild);const opening=document.createElement('div');opening.className='opening-bubble';opening.append(first);while(reply.firstChild)body.append(reply.firstChild);reply.append(leading,opening,body);}
    else{reply.classList.add('no-opener');while(reply.firstChild)body.append(reply.firstChild);reply.append(body);}
   }
  }
  view.hidden=view.dataset.view!==state.layout;
 }
 document.getElementById('view-title').textContent=layoutNotes[state.layout][0];
 document.getElementById('view-description').textContent=layoutNotes[state.layout][1];
 document.getElementById('sample-note').textContent=sampleNotes[state.sample];
 for(const button of document.querySelectorAll('[data-sample]'))button.setAttribute('aria-pressed',String(button.dataset.sample===state.sample));
 for(const button of document.querySelectorAll('button[data-layout]'))button.setAttribute('aria-pressed',String(button.dataset.layout===state.layout));
}
for(const button of document.querySelectorAll('button[data-sample]'))button.addEventListener('click',()=>{state.sample=button.dataset.sample;render();});
for(const button of document.querySelectorAll('button[data-layout]'))button.addEventListener('click',()=>{state.layout=button.dataset.layout;render();});
render();
</script>
</body>
</html>
