<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天气泡 · 两种大改方向</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5fb;
  --surface: #fff;
  --text: #1b192e;
  --muted: #64607d;
  --faint: #7b7794;
  --accent: #5b50e6;
  --border: rgb(91 80 160 / .11);
  --user: linear-gradient(145deg, #eef2ff 0%, #e6e2ff 52%, #f3f0fc 100%);
  --assistant: linear-gradient(165deg, #fff 0%, #f9f7ff 55%, #f3f0ff 100%);
  font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text);
}
* { box-sizing: border-box; }
body { margin: 0; background: #edecf3; }
button { font: inherit; }
.page { max-width: 1640px; margin: auto; padding: 30px 32px 24px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
h1 { font-size: 24px; letter-spacing: -.04em; margin: 0 0 8px; font-weight: 700; }
.intro { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.switcher { display: flex; gap: 4px; padding: 4px; border-radius: 11px; background: #e3e1ed; flex: none; }
.switcher button { border: 0; background: transparent; padding: 9px 14px; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 13px; }
.switcher button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 2px 5px rgb(27 25 46 / .07); }
.switcher button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
.panel { min-width: 0; border: 1px solid rgb(91 80 160 / .14); border-radius: 18px; overflow: hidden; background: var(--bg); box-shadow: 0 4px 18px rgb(27 25 46 / .025); }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; background: #faf9fd; border-bottom: 1px solid var(--border); }
.panel-letter { font-size: 12px; color: var(--muted); height: 28px; width: 28px; display: grid; place-items: center; border: 1px solid rgb(91 80 160 / .18); border-radius: 8px; }
.panel h2 { font-size: 15px; margin: 0; font-weight: 650; }
.panel-head p { margin: 3px 0 0; font-size: 11px; color: var(--faint); }
.chat { padding: 26px 24px 30px; background: radial-gradient(ellipse 85% 55% at 100% 0%, rgb(91 80 230 / .07), transparent 58%), radial-gradient(ellipse 70% 45% at 0% 100%, rgb(56 189 248 / .05), transparent 52%), var(--bg); }
.turn { margin-bottom: 28px; }
.turn:last-child { margin-bottom: 0; }
.pet-turn { display: flex; align-items: flex-start; gap: 14px; }
.avatar { width: 44px; height: 44px; object-fit: cover; border-radius: 13px; flex: none; border: 1px solid #c6b2ff; box-shadow: 0 2px 8px rgb(91 80 230 / .14); }
.pet-content { min-width: 0; flex: 1; }
.speaker { display: flex; align-items: center; gap: 8px; height: 24px; margin-bottom: 7px; color: #8064fb; font-size: 12px; font-weight: 600; }
.status { font-size: 10px; font-weight: 500; padding: 2px 7px; line-height: 16px; border: 1px solid #cdbdff; border-radius: 999px; background: #eee6ff; }
.bubble { position: relative; font-size: 15px; line-height: 1.78; overflow-wrap: anywhere; }
.assistant { padding: 16px 19px; border-radius: 8px 20px 20px 20px; background: var(--assistant); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border)); box-shadow: 0 10px 28px rgb(91 80 230 / .1), inset 0 1px 0 rgb(255 255 255 / .85); }
.user-turn { display: flex; justify-content: flex-end; padding-left: 58px; }
.user { max-width: 88%; background: var(--user); padding: 12px 16px; border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--border)); border-radius: 16px 16px 4px 16px; box-shadow: 0 4px 16px rgb(91 80 230 / .14); line-height: 1.7; }
p { margin: 0 0 11px; }
p:last-child { margin-bottom: 0; }
strong { font-weight: 650; }
blockquote { margin: 12px 0; padding: 10px 12px; border-left: 3px solid #8b8cf0; color: var(--muted); background: rgb(255 255 255 / .55); }
.signature { display: none; }
.panel-foot { padding: 15px 22px; border-top: 1px solid var(--border); background: #faf9fd; color: var(--muted); font-size: 12px; line-height: 1.7; }
.panel-foot strong { color: var(--text); font-weight: 600; }
.note { font-size: 12px; margin: 18px 0 0; color: var(--faint); line-height: 1.8; }
body.new-only .comparison { grid-template-columns: minmax(0, 980px); justify-content: center; }
body.new-only .before { display: none; }
body.new-only .chat { padding: 30px 34px 36px; }
body.new-only .bubble { font-size: 16px; }
body.new-only .user { max-width: 76%; }
@media (max-width: 1000px) {
  .page { padding: 22px 18px; }
  .comparison { grid-template-columns: minmax(0, 1fr); }
  .panel { max-width: 820px; width: 100%; margin-inline: auto; }
}
@media (max-width: 540px) {
  .page { padding: 20px 10px; }
  .page-head { align-items: flex-start; flex-direction: column; gap: 14px; margin-inline: 4px; }
  h1 { font-size: 21px; }
  .chat, body.new-only .chat { padding: 22px 14px 26px; }
  .pet-turn { gap: 11px; }
  .avatar { width: 34px; height: 34px; border-radius: 10px; }
  .bubble, body.new-only .bubble { font-size: 14px; }
  .assistant, .after .assistant { padding: 15px 15px 17px; }
  .user-turn { padding-left: 45px; }
  .user, body.new-only .user { max-width: 96%; }
  .after blockquote { padding: 18px 13px 13px 16px; }
  .panel-head { padding: 16px; }
}
/* Two intentionally stronger bubble-only alternatives. Avatar, speaker row,
   shared palette, conversation text and alignment remain untouched. */
:root { --ink-edge: #9486bf; --offset: #dad1ef; }
.bubble { isolation: isolate; }
/* 01: comic dialogue — outlined silhouette + visible offset underlay. */
.before .assistant {
  padding: 20px 23px 22px;
  border: 2px solid var(--ink-edge);
  border-radius: 24px 24px 24px 5px;
  box-shadow: 6px 7px 0 var(--offset), 6px 7px 0 1px rgb(91 80 160 / .12);
}
.before .assistant::before {
  content: ""; position: absolute; left: -11px; top: 22px; width: 18px; height: 18px;
  background: #fefeff; border-left: 2px solid var(--ink-edge); border-bottom: 2px solid var(--ink-edge);
  border-radius: 0 0 0 4px; transform: rotate(45deg); z-index: -1;
}
.before .assistant::after {
  content: ""; position: absolute; right: 12px; top: 5px; width: 65px; height: 14px;
  background: radial-gradient(circle, #9486bf 1px, transparent 1.4px) 0 0 / 6px 6px;
  clip-path: polygon(20% 0,100% 0,100% 100%,0 100%); opacity: .22; pointer-events: none;
}
.before .user {
  padding: 16px 19px 18px; border: 2px solid var(--ink-edge);
  border-radius: 23px 5px 23px 23px;
  box-shadow: -5px 6px 0 #d7cbed, -5px 6px 0 1px rgb(91 80 160 / .11);
}
.before .user::after {
  content: ""; position: absolute; right: -9px; top: 18px; width: 15px; height: 15px;
  background: #ece9fc; border-top: 2px solid var(--ink-edge); border-right: 2px solid var(--ink-edge);
  border-radius: 0 4px 0 0; transform: rotate(45deg); z-index: -1;
}
.before blockquote {
  position: relative; margin: 19px 0; padding: 11px 17px 12px 18px;
  background: transparent; border: none; border-left: 4px solid #9d8aca;
  color: var(--muted); border-radius: 0; box-shadow: none;
}
.before blockquote::before {
  content: "“"; position: absolute; right: 0; top: -25px;
  font: 70px/1 Georgia, serif; color: #b4a8d4; opacity: .32; z-index: -1;
}
.before .assistant p { margin-bottom: 15px; }
.before .assistant p:last-child { margin-bottom: 0; }
/* 02: folded letter — taped top edge, folded corner, double paper stack. */
.after .assistant {
  padding: 25px 24px 24px; border: 1px solid #c8bcdf;
  border-radius: 4px 0 5px 19px;
  background: var(--assistant);
  box-shadow: 0 5px 0 -1px #ede6fa, 0 5px 0 0 #c8bcdf, 0 10px 0 -2px #fff, 0 10px 0 -1px #d5cce7, 0 14px 18px rgb(40 32 85 / .05);
}
.after .assistant::before {
  content: ""; position: absolute; top: -8px; left: 20px; width: 53px; height: 16px;
  background: rgb(219 207 248 / .8); border: 1px solid rgb(166 144 213 / .28);
  transform: rotate(-5deg); box-shadow: 0 1px 1px rgb(40 32 85 / .04);
}
.after .assistant::after {
  content: ""; position: absolute; top: -1px; right: -1px; width: 23px; height: 23px;
  background: linear-gradient(45deg, #d7cbea 0%, #e9e1f7 48%, #bfb0da 49%, #f6f5fb 52%, #f6f5fb 100%);
  border-bottom-left-radius: 4px;
}
.after .user {
  padding: 15px 23px 22px 19px; border: 1px solid #bdb0da;
  border-bottom: 2px dashed #ac9bc8; border-radius: 18px 18px 3px 3px;
  background: var(--user); box-shadow: 0 5px 0 -1px #e1d7f2, 0 5px 0 0 #c8bcdf;
}
.after .user::after {
  content: ""; position: absolute; right: 10px; top: 13px; bottom: 13px;
  width: 1px; border-right: 1px dashed rgb(148 134 191 / .35);
}
.after blockquote {
  position: relative; padding: 19px 18px 15px 21px; margin: 19px 0 20px;
  border: 1px solid #e1d9ee; border-left: 0; border-radius: 2px 11px 11px 2px;
  background: linear-gradient(90deg, #e5dcf3 0 4px, transparent 4px), rgb(255 255 255 / .65);
  box-shadow: 3px 4px 0 #ede7f5; line-height: 1.9;
}
.after blockquote::before {
  content: ""; position: absolute; left: 13px; top: -5px; width: 14px; height: 12px;
  background: #ab96d5; clip-path: polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);
}
.after .assistant p { margin-bottom: 15px; }
.after .assistant p:last-child { margin-bottom: 0; }
/* The preview controls are outside the product surface. */
body[data-view="comic"] .comparison, body[data-view="letter"] .comparison { grid-template-columns: minmax(0, 980px); justify-content: center; }
body[data-view="comic"] .after, body[data-view="letter"] .before { display: none; }
body[data-view="comic"] .chat, body[data-view="letter"] .chat { padding: 32px 36px 40px; }
body[data-view="comic"] .bubble, body[data-view="letter"] .bubble { font-size: 16px; }
body[data-view="comic"] .user, body[data-view="letter"] .user { max-width: 76%; }
@media (max-width: 540px) {
  .page-head > div { max-width: 100%; }
  .switcher { max-width: 100%; }
  .switcher button { padding: 9px 10px; }
  .chat, body[data-view="comic"] .chat, body[data-view="letter"] .chat { padding: 26px 17px 32px 13px; }
  .before .assistant, .after .assistant { padding: 20px 14px 18px; }
  .before .assistant { border-radius: 20px 20px 20px 4px; box-shadow: 4px 5px 0 var(--offset); }
  .before .user { padding: 15px 15px 18px; box-shadow: -4px 5px 0 #d7cbed; }
  .after .user { padding: 15px 20px 20px 15px; }
  .bubble, body[data-view="comic"] .bubble, body[data-view="letter"] .bubble { font-size: 14px; }
  .user, body[data-view="comic"] .user, body[data-view="letter"] .user { max-width: 96%; }
  .before blockquote { padding-left: 12px; padding-right: 3px; }
  .after blockquote { padding: 18px 12px 13px 17px; }
}
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <div><h1>这次，真的换一种气泡。</h1><p class="intro">只动气泡。小魔王、头像、名字、对话内容与整体布局保持不变。</p></div>
    <nav class="switcher" aria-label="预览方式"><button type="button" aria-pressed="true" data-mode="compare">两版对比</button><button type="button" aria-pressed="false" data-mode="comic">漫画对白</button><button type="button" aria-pressed="false" data-mode="letter">叠纸信笺</button></nav>
  </header>
  <div class="comparison">
    <section class="panel before" aria-labelledby="before-title"><header class="panel-head"><span class="panel-letter" aria-hidden="true">A</span><div><h2 id="before-title">漫画对白</h2><p>明确轮廓 / 错位底影 / 对话尾角</p></div></header><div class="chat" data-chat></div><footer class="panel-foot"><strong>01 · 更有角色感。</strong> 不再像通用面板，像小魔王正在和你说话。</footer></section>
    <section class="panel after" aria-labelledby="after-title"><header class="panel-head"><span class="panel-letter" aria-hidden="true">B</span><div><h2 id="after-title">叠纸信笺</h2><p>双层纸页 / 折角胶带 / 摘录便签</p></div></header><div class="chat" data-chat></div><footer class="panel-foot"><strong>02 · 更有物件感。</strong> 像递来一张写好的信笺，长回复也有清晰的层次。</footer></section>
  </div>
  <p class="note">两版均为静态预览，未修改正式界面；小魔王与文字完全一致。点击顶部名称，可单独查看接近实际聊天区宽度的效果。</p>
</main>
<template id="conversation">
  <div class="turn pet-turn">
    <img class="avatar" src="../public/pet-assets/avatar/pet-idle-still.webp" width="44" height="44" alt="小魔王头像">
    <div class="pet-content"><div class="speaker"><svg class="signature" aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10 2 3l6 4h4l6-4-2 7-6 7Z" fill="currentColor" opacity=".8"/></svg><span>小魔王</span><span class="status">追问</span></div>
      <div class="bubble assistant"><p>如果面试官问：</p><blockquote>“你主要是前端，为什么简历里写了 Spring Boot、REST、Docker？后端做到什么程度？”</blockquote><p>请你用 <strong>30 秒</strong>回答，重点说清楚边界，不要把自己包装成后端开发。</p></div>
    </div>
  </div>
  <div class="turn user-turn"><div class="bubble user">我定位是 前端实习：能独立交付 Vue/React 页面、状态、联调和上线。 Spring Boot / REST 主要来自 Music Dreamer——我负责用户端，按队友提供的接口文档用 Axios 联调，能看懂返回结构和常见状态码，简单接口或字段我会沟通，但表设计、核心业务、部署运维主要是队友。 Docker Compose 是 本地把前后端一起拉起来演示，会改 docker-compose 里的端口、环境变量，不是日常写 Java 服务。 边界：我能讲清请求从页面到接口怎么走、跨域和鉴权怎么配合；不能说我能独立扛 Spring 后端开发。投的是 Web 前端，后端是我协作栈里的 联调能力，不是第二职业。</div></div>
  <div class="turn pet-turn">
    <img class="avatar" src="../public/pet-assets/avatar/pet-idle-still.webp" width="44" height="44" alt="小魔王头像">
    <div class="pet-content"><div class="speaker"><svg class="signature" aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10 2 3l6 4h4l6-4-2 7-6 7Z" fill="currentColor" opacity=".8"/></svg><span>小魔王</span><span class="status">搞定</span></div>
      <div class="bubble assistant"><p><strong>这段边界讲得很稳，特别适合前端实习面试：主线明确是 Vue/React 页面、状态管理、接口联调和上线；Spring Boot 是协作联调经验，Docker Compose 是本地演示环境，不冒充后端主力。</strong></p><p>可以再压成面试口语版：</p><blockquote>我主要投前端实习，能独立完成 Vue/React 页面、状态管理、接口联调和上线。Music Dreamer 里我负责用户端，后端由队友负责；我会根据接口文档用 Axios 联调，能排查请求、响应、跨域和鉴权配合问题，但不把自己说成能独立承担 Spring Boot 后端。Docker Compose 主要用于本地联合启动和演示。</blockquote><p>下一题：<strong>你平时怎么和后端队友约定接口？如果联调时发现字段或响应格式和文档不一致，你会怎么处理？</strong></p></div>
    </div>
  </div>
</template>
<script>
const template = document.getElementById('conversation');
for (const chat of document.querySelectorAll('[data-chat]')) chat.append(template.content.cloneNode(true));
for (const button of document.querySelectorAll('[data-mode]')) {
  button.addEventListener('click', () => {
    document.body.dataset.view = button.dataset.mode;
    for (const item of document.querySelectorAll('[data-mode]')) item.setAttribute('aria-pressed', String(item === button));
  });
}
</script>
</body>
</html>
