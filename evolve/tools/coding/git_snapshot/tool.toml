[tool]
name = "git_snapshot"
description = "只读 Git 快照：从 working_dir/cwd 定位所属仓库根，对整个 Git 仓库返回 status 与 diff stat（可选 staged/full diff）"
version = "1.1.0"
status = "active"
topics = ["coding"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
[schema.input.properties.paths]
type = "array"
items = { type = "string" }
description = "可选，限制 diff 范围（相对 Git 仓库根）；省略时检查整个仓库"
[schema.input.properties.working_dir]
type = "string"
default = ""
description = "要检查的仓库内目录，相对 agent root；会向上定位 Git 根并快照整个仓库；默认 agent root"
[schema.input.properties.cwd]
type = "string"
default = ""
description = "working_dir 的别名"
[schema.input.properties.include_staged]
type = "boolean"
default = true
description = "是否包含 git diff --cached --stat"
[schema.input.properties.include_diff]
type = "boolean"
default = false
description = "是否返回完整工作树 diff 和 staged diff（有上限）"
[schema.input.properties.base_ref]
type = "string"
description = "可选，工作树 diff 的基线 ref；不填则为未暂存工作树"

[schema.output]
type = "object"
[schema.output.properties]
repo_root = { type = "string" }
branch = { type = "string" }
status_lines = { type = "array" }
diff_stat = { type = "string" }
staged_diff_stat = { type = "string" }
untracked_paths = { type = "array" }
diff = { type = "string" }
staged_diff = { type = "string" }

[policy]
# read-only snapshot: no confirm
confirm = false
dry_run_supported = true
allow_approve_all = false
timeout_sec = 30
