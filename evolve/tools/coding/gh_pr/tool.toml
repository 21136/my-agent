[tool]
name = "gh_pr"
description = """受控 GitHub PR 最小集（需本机已登录 `gh`）：create / view / checks / list。

禁止 merge、force、delete。create 须确认（dry_run 除外）；view/checks/list 只读免确认。
"""
version = "1.0.0"
status = "active"
topics = ["coding"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
required = ["action"]
[schema.input.properties.action]
type = "string"
description = "create | view | checks | list"
[schema.input.properties.title]
type = "string"
description = "create：PR 标题"
[schema.input.properties.body]
type = "string"
default = ""
description = "create：PR 正文"
[schema.input.properties.base]
type = "string"
default = ""
description = "create：目标分支；空则用仓库默认分支"
[schema.input.properties.head]
type = "string"
default = ""
description = "create：头部分支；空则用当前分支"
[schema.input.properties.draft]
type = "boolean"
default = false
description = "create：是否 draft"
[schema.input.properties.number]
type = "integer"
description = "view/checks：PR 编号；空则尝试当前分支关联 PR"
[schema.input.properties.limit]
type = "integer"
default = 10
description = "list：最多返回条数"
[schema.input.properties.working_dir]
type = "string"
default = ""
description = "相对 agent root 的仓库子目录；空=agent root"
[schema.input.properties.cwd]
type = "string"
default = ""
description = "working_dir 别名"
[schema.input.properties.dry_run]
type = "boolean"
default = false
description = "create 时只预览 gh 参数，不创建"

[schema.output]
type = "object"

[policy]
confirm = true
dry_run_supported = true
allow_approve_all = false
timeout_sec = 120
