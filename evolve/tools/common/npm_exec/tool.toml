[tool]

name = "npm_exec"

description = "在 workspace 子目录运行 npm 命令，捕获 stdout/stderr/exit_code"

version = "1.0.0"

status = "archived"

topics = ["common"]



[entry]

type = "python"

path = "main.py"



[schema.input]

type = "object"

required = ["args"]

[schema.input.properties.args]

type = "array"

items = { type = "string" }

description = "npm 参数，如 [\"install\"] 或 [\"run\", \"dev\"]"

[schema.input.properties.working_dir]

type = "string"

default = ""

description = "相对 workspace/ 的项目目录；空则 workspace 根"

[schema.input.properties.timeout_sec]

type = "integer"

default = 300

description = "子进程超时秒数"

[schema.input.properties.dry_run]

type = "boolean"

default = false

description = "仅预览命令，不执行"



[schema.output]

type = "object"

[schema.output.properties]

command = { type = "array" }

cwd = { type = "string" }

exit_code = { type = "integer" }

stdout = { type = "string" }

stderr = { type = "string" }



[policy]

confirm = true

dry_run_supported = true

workspace_only = false

timeout_sec = 310

