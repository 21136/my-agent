[tool]
name = "append_text"
description = "向 agent root 文本文件追加内容；path 相对 agent root 或 host:<id>/…；文件不存在时可创建"
version = "1.0.0"
status = "archived"
topics = ["common"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
required = ["path", "content"]
[schema.input.properties.path]
type = "string"
[schema.input.properties.content]
type = "string"
[schema.input.properties.create_if_missing]
type = "boolean"
default = true
description = "文件不存在时是否创建"
[schema.input.properties.separator]
type = "string"
default = "\n"
description = "追加到已有内容前插入的分隔符（仅文件非空时）"

[schema.output]
type = "object"
[schema.output.properties]
path = { type = "string" }
created = { type = "boolean" }
bytes_appended = { type = "integer" }

[policy]
confirm = true
dry_run_supported = true
allow_approve_all = true
timeout_sec = 60
