[tool]
name = "pip_install"
description = """用当前解释器安装 Python 包（python -m pip install）。packages 与 requirements 二选一。

包名拒 shell 元字符；requirements 须在 agent root 内。dry_run 仅预览。每次安装须 confirm（dry_run 除外）。"""
version = "1.1.0"
status = "archived"
topics = ["common"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
[schema.input.properties.packages]
type = "array"
items = { type = "string" }
description = "包名/规格列表，如 [\"httpx==0.27.0\"]"
[schema.input.properties.requirements]
type = "string"
description = "相对 agent root 的 requirements.txt"
[schema.input.properties.upgrade]
type = "boolean"
default = false
[schema.input.properties.timeout_sec]
type = "integer"
default = 120
description = "超时秒数，上限 300"
[schema.input.properties.dry_run]
type = "boolean"
default = false
[schema.input.properties.working_dir]
type = "string"
default = ""
description = "可选；预留，用于对齐项目目录语境"

[schema.output]
type = "object"

[policy]
confirm = true
dry_run_supported = true
allow_approve_all = false
timeout_sec = 310
