[tool]
name = "project_catalog"
description = "List workspace projects and, on explicit request, one project’s chat-thread summaries (read-only)"
version = "1.0.0"
status = "active"
topics = ["common"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"

[schema.input.properties.include_summaries]
type = "boolean"
default = false
description = "Include truncated PROJECT.md summary per project"

[schema.input.properties.include_threads]
type = "boolean"
default = false
description = "List active and recent archived chat lines for one project; requires project_id"

[schema.input.properties.project_id]
type = "string"
description = "Registered project id to scope include_threads results to"

[schema.input.properties.dry_run]
type = "boolean"
default = false

[schema.output]
type = "object"

[policy]
confirm = false
dry_run_supported = true
allow_approve_all = false
timeout_sec = 60
