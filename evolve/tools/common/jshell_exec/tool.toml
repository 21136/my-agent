[tool]
name = "jshell_exec"
description = "interactive Java REPL via jshell, maintains state across calls via session_id"
version = "1.0.0"
status = "suspect"
topics = ["common"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
required = ["code"]
[schema.input.properties.code]
type = "string"
description = "Java snippet to execute (statements, expressions, var declarations)"
[schema.input.properties.session_id]
type = "string"
default = "default"
description = "jshell session ID, same ID shares variable state"
[schema.input.properties.reset]
type = "boolean"
default = false
description = "reset session state (clear variables)"
[schema.input.properties.timeout_sec]
type = "integer"
default = 30
description = "subprocess timeout in seconds"
[schema.input.properties.dry_run]
type = "boolean"
default = false
description = "preview only"

[schema.output]
type = "object"
[schema.output.properties]
session_id = { type = "string" }
exit_code = { type = "integer" }
stdout = { type = "string" }
stderr = { type = "string" }
error = { type = "string" }

[policy]
confirm = true
dry_run_supported = true
allow_approve_all = false
timeout_sec = 40
