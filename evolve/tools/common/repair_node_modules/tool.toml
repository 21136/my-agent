[tool]
name = "repair_node_modules"
description = "显式修复前端依赖：删除 working_dir 下 node_modules（可选 lock）后执行 npm/pnpm/yarn install。须点名调用，非自动剧本。"
version = "1.0.0"
status = "active"
topics = ["common", "coding"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
required = ["working_dir"]
[schema.input.properties.working_dir]
type = "string"
description = "前端目录，相对 agent root（如 workspace/huiyi/frontend）；可用别名 cwd/path"
[schema.input.properties.cwd]
type = "string"
description = "working_dir 别名"
[schema.input.properties.path]
type = "string"
description = "working_dir 别名"
[schema.input.properties.package_manager]
type = "string"
default = "auto"
description = "auto|npm|pnpm|yarn；auto 读项目 ENV.md prefer.package_manager"
[schema.input.properties.remove_lock]
type = "boolean"
default = false
description = "true 时同时删除 package-lock.json / pnpm-lock.yaml / yarn.lock"
[schema.input.properties.skip_install]
type = "boolean"
default = false
description = "true 时只删 node_modules（及可选 lock），不跑 install"
[schema.input.properties.timeout_sec]
type = "integer"
description = "install 超时秒数；默认跟 MY_AGENT_RUN_COMMAND_LONG_TIMEOUT_SEC（≥600）"
[schema.input.properties.dry_run]
type = "boolean"
default = false
description = "只预览将执行的步骤，不删不装"

[schema.output]
type = "object"
[schema.output.properties]
ok = { type = "boolean" }
cwd = { type = "string" }
package_manager = { type = "string" }
node_modules_present = { type = "boolean" }
steps = { type = "array" }
dry_run = { type = "boolean" }

[policy]
confirm = true
dry_run_supported = true
allow_approve_all = false
timeout_sec = 1810
