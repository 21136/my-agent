[tool]
name = "study_note"
description = "organize markdown notes by tags"
version = "1.0.0"
status = "archived"
topics = ["workflow"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
required = []
[schema.input.properties.source_dir]
type = "string"
description = "source dir under agent root, default inbox"
default = "inbox"
[schema.input.properties.target_dir]
type = "string"
description = "target dir under agent root, default notes"
default = "notes"
[schema.input.properties.action]
type = "string"
description = "list=preview, organize=execute"
enum = ["list", "organize"]
default = "list"

[schema.output]
type = "object"
[schema.output.properties]
ok = { type = "boolean"}
dry_run = { type = "boolean"}
entries = { type = "array"}
category_counts = { type = "object"}

[policy]
confirm = true
dry_run_supported = true
allow_approve_all = true
timeout_sec = 60
