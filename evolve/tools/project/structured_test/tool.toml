[tool]
name = "structured_test"
description = "统一项目测试结果协议；复用 run_project_tests，返回 status、失败定位、耗时、尾部输出和可选重跑提示"
version = "0.1.0"
status = "active"
topics = ["project", "coding"]

[entry]
type = "python"
path = "main.py"

[schema.input]
type = "object"
required = ["working_dir"]
[schema.input.properties.working_dir]
type = "string"
description = "项目内目录，相对 agent 根"
[schema.input.properties.suite]
type = "string"
description = "auto | pytest | jest | vitest | mvn | npm_test"
[schema.input.properties.extra_args]
type = "array"
items = { type = "string" }
[schema.input.properties.timeout_sec]
type = "integer"
default = 600
[schema.input.properties.max_failures]
type = "integer"
default = 20
[schema.input.properties.dry_run]
type = "boolean"
default = false

[schema.output]
type = "object"
[schema.output.properties.status]
type = "string"
enum = ["passed", "failed", "blocked", "timeout"]
[schema.output.properties.exit_code]
type = "integer"
[schema.output.properties.duration_ms]
type = "integer"
[schema.output.properties.failed]
type = "array"
[schema.output.properties.stdout_tail]
type = "string"
[schema.output.properties.stderr_tail]
type = "string"

[policy]
confirm = false
dry_run_supported = true
allow_approve_all = false
timeout_sec = 1800
